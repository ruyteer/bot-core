name: Build, Push and Deploy a Docker Image to Railway

on:
  push:
    branches: [prd]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-push-deploy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Encore CLI script
        uses: sozo-design/curl@v1.0.2
        with:
          args: --output install.sh -L https://encore.dev/install.sh

      - name: Install Encore CLI
        run: bash install.sh

      - name: Build Core Service
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${REPO}-core"
          TAG="sha-${COMMIT_SHA:0:12}"

          /home/runner/.encore/bin/encore build docker \
            --config railway-infra.config.json \
            ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest

      - name: Trigger Railway deployment
        run: node script.js ${{ secrets.RAILWAY_API_TOKEN }}
